app = "docsign-bettersign-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PARSE_MOUNT = "/app"
  USE_LOCAL = "TRUE"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/"

[mounts]
  source = "opensign_files"
  destination = "/usr/src/app/files"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
